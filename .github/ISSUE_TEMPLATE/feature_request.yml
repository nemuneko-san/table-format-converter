name: 機能の要望
description: 新しい機能や改善を提案します
title: "[要望] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どんな場面で、何に困っているかを書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容
      description: 実現したい機能や動作を書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代わりの方法（任意）
      description: 今の使い方での回避策や、検討した別の案があれば書いてください。
    validations:
      required: false
